# 콘솔에 제출하는 정책 페이지를 GitHub Pages로 올린다.
#
# `site/`만 올린다. 저장소 루트의 `index.html`은 빌드 전 Vite 진입점이라
# 그대로 서빙하면 동작하지 않는다. 미니앱 자체는 `.ait` 번들로 배포되고
# 여기서 서빙하지 않는다.
name: 정책 페이지 배포

on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
