<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>한 줄 여름</title>
    <meta
      name="description"
      content="친구와 한 붓씩 주고받으며 우리만의 여름 그림을 완성해요."
    />
    <meta property="og:title" content="한 줄 여름" />
    <meta
      property="og:description"
      content="여름 배경에 한 붓을 더해 친구에게 토스해요."
    />
    <meta property="og:type" content="website" />
    <link rel="preload" as="image" href="./assets/theme-sunset-beach.jpg" />
    <link rel="stylesheet" href="./styles.css?v=12" />
  </head>
  <body>
    <main class="app-shell">
      <section class="screen home-screen" id="homeScreen">
        <div class="home-copy">
          <p class="section-label">함께 그리는 여름</p>
          <h1 class="home-title">
            친구와 한 붓씩<br />
            우리 여름을 그려요
          </h1>
          <p class="lead">
            여름 배경에 한 붓을 더해 친구에게 보내요.<br />
            친구가 다시 한 붓을 이어줘요.
          </p>
        </div>

        <div class="hero-art" aria-hidden="true">
          <img
            src="./assets/theme-sunset-beach.jpg"
            alt=""
            width="720"
            height="900"
          />
          <svg class="hero-stroke" viewBox="0 0 360 270">
            <path
              d="M36 122 C82 88 116 145 160 122 C207 98 224 158 270 133 C300 117 319 137 334 157"
              fill="none"
              stroke="#ef6351"
              stroke-linecap="round"
              stroke-width="8"
            />
          </svg>
        </div>

        <button class="primary-button" id="startButton" type="button">
          첫 한 붓 그리기
        </button>
      </section>

      <section class="screen setup-screen hidden" id="setupScreen">
        <div class="screen-copy">
          <p class="section-label">배경 선택</p>
          <h1 class="screen-title">그릴 배경을 골라요</h1>
          <p class="lead compact">마음에 드는 여름 하나를 선택해 주세요.</p>
        </div>

        <fieldset class="choice-block">
          <legend class="sr-only">여름 배경 선택</legend>
          <div class="theme-grid" id="themeGroup"></div>
        </fieldset>

        <div class="bottom-cta">
          <button class="primary-button" id="createCanvasButton" type="button">
            선셋 비치에 그리기
          </button>
        </div>
      </section>

      <section class="screen invite-screen hidden" id="inviteScreen">
        <div class="screen-copy">
          <p class="section-label" id="inviteEyebrow">한 붓이 도착했어요</p>
          <h1 class="screen-title" id="inviteTitle">
            친구가 한 붓을 보냈어요<br />
            원하는 곳에 한 붓을 더해요
          </h1>
        </div>

        <div class="canvas-card canvas-card-preview">
          <canvas
            class="art-canvas"
            id="inviteCanvas"
            width="720"
            height="900"
            aria-label="친구에게 받은 여름 그림"
          ></canvas>
        </div>

        <button class="primary-button" id="acceptInviteButton" type="button">
          한 붓 더하기
        </button>
      </section>

      <section class="screen draw-screen hidden" id="drawScreen">
        <div class="draw-heading">
          <p class="section-label" id="drawEyebrow">선셋 비치</p>
          <h1 class="draw-title" id="drawTitle">원하는 곳에 한 붓 그려요</h1>
          <p class="draw-guide" id="drawGuide">
            손가락을 떼기 전까지 한 번에 그려요.
          </p>
        </div>

        <div class="canvas-card canvas-card-draw" id="drawCanvasCard">
          <canvas
            class="art-canvas"
            id="drawCanvas"
            width="720"
            height="900"
            aria-label="한 붓을 더하는 여름 그림"
            aria-describedby="drawStatus"
          ></canvas>
        </div>

        <div class="drawing-toolbar">
          <span class="tool-label">펜 색</span>
          <div
            class="color-group"
            id="colorGroup"
            role="group"
            aria-label="펜 색 선택"
          ></div>
        </div>

        <div class="drawing-actions">
          <button class="tool-button" id="undoButton" type="button" disabled>
            다시 그리기
          </button>
          <button
            class="primary-button inline-primary"
            id="commitButton"
            type="button"
            disabled
          >
            친구에게 토스하기
          </button>
        </div>

        <p class="helper" id="drawStatus" role="status" aria-live="polite">
          캔버스 어디서든 시작할 수 있어요.
        </p>

        <div class="share-fallback hidden" id="shareFallback">
          <p class="share-title">링크를 직접 복사할 수 있어요</p>
          <div class="share-row">
            <input
              class="text-input"
              id="shareLink"
              readonly
              aria-label="공유 링크"
            />
            <button class="copy-button" id="copyButton" type="button">
              복사
            </button>
          </div>
          <p class="helper" id="copyStatus" role="status" aria-live="polite"></p>
        </div>
      </section>

      <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
    </main>

    <script src="./app.js?v=12"></script>
  </body>
</html>
