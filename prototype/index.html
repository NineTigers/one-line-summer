<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e6978" />
    <title>올여름 내가 토스할게</title>
    <meta
      name="description"
      content="친구에게 여름 한 컷을 토스하고, 이어받아 함께 완성해요."
    />
    <meta property="og:title" content="올여름 내가 토스할게" />
    <meta
      property="og:description"
      content="친구에게 여름 한 컷을 토스하고, 이어받아 함께 완성해요."
    />
    <meta property="og:image" content="./assets/comic-cover.jpg" />
    <meta property="og:type" content="website" />
    <link rel="preload" href="./assets/beach-court-day.jpg" as="image" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="ball-mark" aria-hidden="true"></span>
          <span>올여름 내가 토스할게</span>
          <span class="prototype-badge">체험판</span>
        </div>
        <button class="text-button" id="restartButton" type="button">
          처음부터
        </button>
      </header>

      <!-- A. 링크로 들어온 사람이 앞 컷을 받는 화면 -->
      <section class="screen hidden" id="receiveScreen">
        <p class="eyebrow" id="receiveCount"></p>
        <h1 class="screen-title">여름 한 컷이<br />도착했어요</h1>
        <div id="incomingCut"></div>
        <button class="primary-button" id="continueButton" type="button">
          나도 이어쓰기
        </button>
        <button class="text-link" id="viewStripFromReceive" type="button">
          지금까지 이어진 컷 보기
        </button>
      </section>

      <!-- B. 내 컷 만들기 -->
      <section class="screen hidden" id="composeScreen">
        <p class="eyebrow" id="composeEyebrow">2026 여름</p>
        <h1 class="screen-title" id="composeTitle">
          이번 여름,<br />어떤 장면이 좋아요?
        </h1>

        <fieldset class="choice-block">
          <legend>여름 장면</legend>
          <div class="scene-grid" id="sceneGroup"></div>
        </fieldset>

        <fieldset class="choice-block">
          <legend>내가 맡을 것</legend>
          <div class="chip-grid" id="roleGroup"></div>
        </fieldset>

        <fieldset class="choice-block">
          <legend>한마디</legend>
          <div class="chip-grid" id="lineGroup"></div>
          <input
            class="text-input"
            id="customLine"
            maxlength="20"
            placeholder="직접 쓰기 (20자)"
            aria-label="한마디 직접 쓰기"
          />
        </fieldset>

        <fieldset class="choice-block">
          <legend>이름</legend>
          <input
            class="text-input"
            id="nameInput"
            maxlength="8"
            placeholder="여름 친구"
            aria-label="이름"
          />
          <p class="field-note">비워두면 `여름 친구`로 남아요.</p>
        </fieldset>

        <button class="primary-button" id="tossButton" type="button" disabled>
          토스하기
        </button>
        <p class="helper" id="composeHelper" role="status" aria-live="polite">
          장면과 맡을 것을 고르면 토스할 수 있어요.
        </p>
      </section>

      <!-- C. 토스 전환 연출 -->
      <section class="screen hidden" id="tossScreen">
        <div class="toss-stage" id="tossStage" aria-hidden="true">
          <span class="toss-ball" id="tossBall"></span>
        </div>
        <p class="eyebrow">TOSS</p>
        <h2 class="screen-title" id="tossMessage">공이 날아가는 중</h2>
      </section>

      <!-- D. 우리 릴레이 -->
      <section class="screen hidden" id="stripScreen">
        <p class="countdown" id="countdown"></p>
        <p class="eyebrow" id="stripCount"></p>
        <h1 class="screen-title">우리 여름 릴레이</h1>

        <div class="strip" id="stripList"></div>

        <div class="poster" id="poster">
          <div class="poster-scene" aria-hidden="true"></div>
          <p class="poster-kicker">2026 SUMMER RELAY</p>
          <h2 id="posterHeadline"></h2>
          <p id="posterNames"></p>
        </div>

        <button class="primary-button" id="shareButton" type="button">
          이어서 토스할 친구에게 보내기
        </button>

        <div class="share-box hidden" id="shareBox">
          <label class="field-note" for="shareLink">이 링크를 보내면 이어져요</label>
          <div class="share-row">
            <input class="text-input" id="shareLink" readonly />
            <button class="copy-button" id="copyButton" type="button">복사</button>
          </div>
          <p class="field-note" id="copyStatus" role="status" aria-live="polite"></p>
        </div>

        <button class="text-link" id="newRelayButton" type="button">
          새 릴레이 시작하기
        </button>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
