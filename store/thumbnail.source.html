<!doctype html><meta charset="utf-8">
<title>한 줄 여름 썸네일</title>
<!--
  콘솔 규격 1932x828 PNG.
  앱 이름을 크게 넣지 않는다. 지면에 이미 이름이 표기돼 중복이다.
  대신 제품의 한 문장 약속을 그대로 쓰고, 오른쪽에 실제 밑그림과
  한 붓을 놓아 탭하면 무엇을 하게 되는지 미리 보여준다.

  `/assets/theme-sunset-beach.jpg`를 불러오므로 빌드 결과물을 서빙하는
  서버 위에서 캡처해야 한다. `make-assets.sh`가 그렇게 한다.
-->
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1932px;
    height: 828px;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    gap: 96px;
    padding: 0 120px;
    box-sizing: border-box;
    background: linear-gradient(135deg, #FFF4E0 0%, #FFE3CE 100%);
    font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard",
      system-ui, sans-serif;
    color: #191f28;
  }
  .copy {
    flex: 1 1 auto;
    min-width: 0;
  }
  .eyebrow {
    margin: 0 0 28px;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #087f7a;
  }
  .headline {
    margin: 0;
    font-size: 96px;
    font-weight: 800;
    line-height: 1.22;
    letter-spacing: -0.035em;
  }
  .headline em {
    font-style: normal;
    color: #C24C3A;
  }
  .steps {
    margin: 44px 0 0;
    padding: 0;
    list-style: none;
    display: flex;
    gap: 18px;
    font-size: 34px;
    font-weight: 600;
    color: #4e5968;
  }
  .steps li {
    background: rgba(255, 255, 255, 0.78);
    border-radius: 999px;
    padding: 16px 30px;
  }
  .art {
    flex: 0 0 auto;
    width: 604px;
    height: 755px;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 32px 64px rgba(120, 72, 40, 0.24);
  }
  .art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .art svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>

<div class="copy">
  <p class="eyebrow">함께 그리는 여름</p>
  <h1 class="headline">
    한 붓 그리고,<br />
    친구에게 <em>토스</em>하고,<br />
    한 붓 더 받아요
  </h1>
  <ul class="steps">
    <li>배경 고르기</li>
    <li>한 붓 그리기</li>
    <li>링크로 토스</li>
  </ul>
</div>

<div class="art">
  <img src="/assets/theme-sunset-beach.jpg" alt="" />
  <svg viewBox="0 0 1000 1000" preserveAspectRatio="none">
    <g fill="none" stroke-linecap="round" stroke-width="26">
      <path
        d="M130 545 Q192 505 255 505 Q320 505 385 560 Q450 560 515 512 Q580 512 645 566 Q707 566 770 520 Q825 520 880 552"
        stroke="#0e7780"
      />
      <path
        d="M250 330 Q290 262 330 262 Q368 262 408 330 Q447 330 487 262 Q526 262 566 330"
        stroke="#8a4272"
      />
      <path
        d="M175 745 Q247 700 320 700 Q395 700 470 742 Q545 742 620 698 Q732 698 845 736"
        stroke="#f7c44b"
      />
    </g>
  </svg>
</div>
